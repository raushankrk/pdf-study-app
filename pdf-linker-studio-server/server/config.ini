# ==========================================
# PDF Linker Studio — Server Configuration
# ==========================================
# Edit this file to match your Windows PC setup, then run `run.bat`.

[server]
# Host: 0.0.0.0 means "listen on all network interfaces" so other devices
# on the same Wi-Fi/LAN can reach the server. Use 127.0.0.1 for local-only.
host = 0.0.0.0

# Port the FastAPI server listens on. Make sure this port is open in Windows Firewall.
port = 8000

# Where the frontend static files live (relative to the project root, i.e.
# the parent of the server/ folder).
static_dir = static

# Where application data lives (SQLite DB + uploaded PDFs + annotation images).
data_dir = data

[ollama]
# URL of the Ollama server running on the Windows PC. The browser never talks to
# Ollama directly — all embedding/chat requests go through FastAPI which forwards
# them to this URL.
url = http://localhost:11434

# Default embedding model. Pull with: ollama pull nomic-embed-text
embedding_model = nomic-embed-text

# Default LLM model. Pull with: ollama pull gemma3:1b
llm_model = gemma3:1b

[ai]
# Maximum number of PDF pages to extract text from per document during indexing.
max_pages_per_doc = 50

# Number of seconds to wait for an Ollama response before timing out.
request_timeout = 120
